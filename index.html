<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Radar Mundial</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --bg: #000000;
      --card: #141416;
      --border: #242428;
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.15);
      --text: #f4f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 20px 16px 40px;
      max-width: 640px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 4px 4px 0;
    }
    h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
    .fecha { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    button.refresh {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.refresh:active { opacity: 0.7; }
    .hero {
      background: linear-gradient(145deg, #0d261e, #101614);
      border: 1px solid #1f4d3e;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .hero-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #34d399;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero-title { font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: #34d399;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 10px;
    }
    .resumen { font-size: 0.95rem; color: #e5e7eb; margin-bottom: 12px; }
    ul { padding-left: 18px; color: var(--muted); font-size: 0.88rem; }
    li { margin-bottom: 6px; }
    li::marker { color: var(--accent); }
    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer a { color: #34d399; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Radar Mundial</h1>
      <div class="fecha" id="fecha">Cargando resumen...</div>
    </div>
    <button class="refresh" onclick="cargarDatos()">↻ Actualizar</button>
  </header>

  <main id="contenedor"></main>

  <footer>
    Actualización automática cada 8h · 
    <a href="[https://github.com/11flematic/world-weekly-radar/actions](https://github.com/11flematic/world-weekly-radar/actions)" target="_blank">Forzar IA en GitHub</a>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    async function cargarDatos() {
      const contenedor = document.getElementById('contenedor');
      const fechaEl = document.getElementById('fecha');
      try {
        const resp = await fetch('./datos.json?t=' + Date.now());
        if (!resp.ok) throw new Error('No se pudo leer datos.json');
        const data = await resp.json();

        fechaEl.textContent = 'Actualizado: ' + (data.fecha_actualizacion || 'Reciente');
        contenedor.innerHTML = '';

        const hero = document.createElement('section');
        hero.className = 'hero';
        const heroLabel = document.createElement('div');
        heroLabel.className = 'hero-label';
        heroLabel.textContent = 'Titular global de la semana';
        const heroTitle = document.createElement('div');
        heroTitle.className = 'hero-title';
        heroTitle.textContent = data.titular_semana || '';
        hero.append(heroLabel, heroTitle);
        contenedor.appendChild(hero);

        (data.bloques || []).forEach(bloque => {
          const card = document.createElement('article');
          card.className = 'card';

          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = bloque.categoria || '';

          const p = document.createElement('p');
          p.className = 'resumen';
          p.textContent = bloque.resumen || '';

          card.append(badge, p);

          if (Array.isArray(bloque.puntos_clave) && bloque.puntos_clave.length) {
            const ul = document.createElement('ul');
            bloque.puntos_clave.forEach(punto => {
              const li = document.createElement('li');
              li.textContent = punto;
              ul.appendChild(li);
            });
            card.appendChild(ul);
          }

          contenedor.appendChild(card);
        });
      } catch (err) {
        fechaEl.textContent = 'Error de carga';
        contenedor.innerHTML = '<div class="card"><p class="resumen">No se pudo cargar el resumen. Comprueba tu conexión o espera un minuto si GitHub Pages acaba de publicarse.</p></div>';
      }
    }

    cargarDatos();
  </script>
</body>
</html>
